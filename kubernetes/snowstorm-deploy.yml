---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: elastic-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: local-path
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: elasticsearch
  labels:
    app: elasticsearch
spec:
  replicas: 1
  selector:
    matchLabels:
      app: elasticsearch
  template:
    metadata:
      labels:
        app: elasticsearch
    spec:
      containers:
        - name: elasticsearch
          image: docker.elastic.co/elasticsearch/elasticsearch:8.11.1
          env:
            - name: discovery.type
              value: "single-node"
            - name: xpack.security.enabled
              value: "false"
            - name: node.name
              value: "snowstorm"
            - name: cluster.name
              value: "snowstorm-cluster"
            - name: ES_JAVA_OPTS
              value: "-Xms4g -Xmx4g"
          ports:
            - containerPort: 9200
              protocol: TCP
          volumeMounts:
            - name: elastic
              mountPath: /usr/share/elasticsearch/data
          livenessProbe:
            exec:
              command:
                - curl
                - -f
                - http://localhost:9200
            initialDelaySeconds: 10
            periodSeconds: 1
            timeoutSeconds: 1
            failureThreshold: 60
          resources:
            requests:
              memory: "4Gi"
            limits:
              memory: "6Gi"
      volumes:
        - name: elastic
          persistentVolumeClaim:
            claimName: elastic-pvc
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: snowstorm
  labels:
    app: snowstorm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: snowstorm
  template:
    metadata:
      labels:
        app: snowstorm
    spec:
      # Mimic docker-compose "depends_on" by waiting for Elasticsearch to be healthy
      initContainers:
        - name: wait-for-elasticsearch
          image: curlimages/curl:8.1.2
          command:
            - sh
            - -c
            - 'until curl -f http://es:9200; do echo "Waiting for Elasticsearch"; sleep 1; done'
      containers:
        - name: snowstorm
          image: tellmey/snowstorm:latest
          # Overwrite the default entrypoint to match docker-compose's command
          command:
            - "java"
          args:
            - "-Xms2g"
            - "-Xmx4g"
            - "--add-opens"
            - "java.base/java.lang=ALL-UNNAMED"
            - "--add-opens=java.base/java.util=ALL-UNNAMED"
            - "-cp"
            - "@/app/jib-classpath-file"
            - "org.snomed.snowstorm.SnowstormApplication"
            - "--elasticsearch.urls=http://es:9200"
          ports:
            - containerPort: 8080
              protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: es
  labels:
    app: elasticsearch
spec:
  selector:
    app: elasticsearch
  ports:
    - protocol: TCP
      port: 9200
      targetPort: 9200
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: snowstorm
  labels:
    app: snowstorm
spec:
  selector:
    app: snowstorm
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
  type: ClusterIP
