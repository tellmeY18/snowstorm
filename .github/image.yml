name: Deploy

on:
  push:
    branches: [ containerised ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # Checkout the repository code
      - name: Checkout repository
        uses: actions/checkout@v3

      # Set up the JDK (Java 11 in this example; adjust as needed)
      - name: Set up JDK 11
        uses: actions/setup-java@v3
        with:
          distribution: 'adopt'
          java-version: '11'

      # Cache Maven dependencies to speed up builds
      - name: Cache Maven packages
        uses: actions/cache@v3
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}

      # Build the project and run tests
      - name: Build and test
        run: mvn clean install

      # Build the Docker image (assumes a Dockerfile exists in the repository root)
      - name: Build Docker image
        run: docker build -t ghcr.io/${{ github.repository_owner }}/snowstorm:latest .

      # Log in to GitHub Container Registry using a secret token
      - name: Log in to GitHub Container Registry
        run: echo ${{ secrets.GHCR_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      # Push the Docker image to GHCR
      - name: Push Docker image to GHCR
        run: docker push ghcr.io/${{ github.repository_owner }}/snowstorm:latest
